name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI only reads the repository. The release workflow is the one place with
# write access.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      # The public platform must never contain, import or name private code.
      - name: No private references
        run: uv run python tools/check_private_references.py

      # The dashboard, its hosted copy and `qc benchmark` read this sample.
      - name: Sample data is committed
        run: test "$(git ls-files 'data/benchmark/*.csv' | wc -l)" -ge 10

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Non-blocking for now. `ty` reports pre-existing diagnostics in the
      # backtest runner and the test suite that predate this workflow; failing the
      # build on them would mean fixing all of them here rather than in the
      # phase that owns that code. See the housekeeping phase in PROJECT_PLAN.md.
      - name: Type-check (advisory)
        run: uv run ty check
        continue-on-error: true

      - name: Test
        run: uv run pytest

  standalone:
    name: Installed package stands alone
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Proves what a downstream package will get: the built wheel, installed into
    # a clean environment, run from a directory that is not this checkout, with
    # no source tree on the path.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Build the wheel
        run: uv build --wheel

      # Pin dependencies to the lockfile so the regression baseline, which was
      # generated against the locked engine version, applies.
      - name: Install the wheel into a clean environment
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/constraints.txt"
          uv venv "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" \
            -c "$RUNNER_TEMP/constraints.txt" dist/*.whl pytest

      - name: Run the suite and the CLI outside the source tree
        run: |
          WORK="$RUNNER_TEMP/standalone"
          mkdir -p "$WORK" && cp -r testing "$WORK/" && cd "$WORK"
          PY="$RUNNER_TEMP/clean/bin/python"
          QC="$RUNNER_TEMP/clean/bin/qc"
          "$PY" -c "import quant_core; assert 'site-packages' in quant_core.__file__, quant_core.__file__; print('quant-core', quant_core.__version__)"
          "$QC" --help
          "$QC" strategies
          "$PY" -m pytest -q -p no:cacheprovider testing --ignore=testing/debug_scripts
          "$PY" -c "import os; from quant_core.testing import synthetic_ohlcv; os.makedirs('data/benchmark', exist_ok=True); synthetic_ohlcv().rename_axis('Date').to_csv('data/benchmark/FIXTURE_synthetic.csv')"
          "$QC" benchmark
          ls reports/benchmark_report_multi_asset_*.md
          "$QC" dashboard --export site --data-dir data/benchmark
          test -s site/index.html && test -s site/static/app.js && test -s site/api/meta.json
          ls site/api/runs/*.json | head -3
