name: Release

# Tags a release when the version in pyproject.toml has no tag yet.
#
# - On every push to master: tags the new master commit as v<version> if that
#   tag does not exist. A merge that bumps the version therefore releases it;
#   a merge that does not is a no-op.
# - Manually (workflow_dispatch): tags an existing commit on master, for
#   backfilling a release that predates this workflow.
#
# It only ever creates tags. It never moves or deletes one, because downstream
# packages pin to them and a moved tag silently changes what they install.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit on master to tag (full or short SHA)"
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Work out the version and check the commit
        id: v
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # Only reviewed code gets released: the commit must be on master.
          git merge-base --is-ancestor "$SHA" origin/master \
            || { echo "::error::$SHA is not on master; refusing to tag it."; exit 1; }
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::version '$VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to do."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release
        if: steps.v.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -euo pipefail
          # Release notes: this version's section of CHANGELOG.md, if there is one.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {on=1; next}
              on && /^## \[/ {exit}
              on {print}
            ' CHANGELOG.md > notes.md
          fi
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "quant-core $VERSION"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "quant-core $VERSION" --notes-file notes.md
          echo "Released $TAG at $SHA"
