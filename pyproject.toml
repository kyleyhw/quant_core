[project]
name = "quant-core"
version = "0.2.0"
description = "Algorithmic Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "backtesting>=0.6.5",
    "hmmlearn>=0.3.3",
    "ib-insync>=0.9.86",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "streamlit>=1.40.0",
    "ta-lib>=0.6.8",
    "tabulate>=0.9.0",
    "xgboost>=3.1.2",
    "yfinance>=0.2.66",
]

[project.scripts]
qc = "quant_core.cli:main"

# The platform's reference strategies register through the same entry-point
# group a downstream package uses, so there is one discovery path for both.
[project.entry-points."quant_core.strategies"]
BollingerBandsStrategy = "quant_core.strategies.bollinger_bands:BollingerBandsStrategy"
BuyAndHoldStrategy = "quant_core.strategies.buy_and_hold:BuyAndHoldStrategy"
RSI2PeriodStrategy = "quant_core.strategies.rsi_2_period:RSI2PeriodStrategy"
SimpleMACrossover = "quant_core.strategies.simple_ma_crossover:SimpleMACrossover"

[tool.uv]
package = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pytest>=8.3.0",
    "hypothesis>=6.152.4",
    "networkx>=3.4.2",
    "pre-commit>=4.5.0",
    "ruff>=0.14.8",
    "ty>=0.0.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated backtest reports: bokeh dumps and non-UTF-8 bytes, not source.
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["quant_core", "testing", "tools"]

# E402 (module-level import not at top of file) is intentional in scripts that
# bootstrap sys.path before importing first-party packages. Suppress per-file
# rather than globally so the rule still catches accidental misordered imports
# in library code.
[tool.ruff.lint.per-file-ignores]
"testing/generate_baseline.py" = ["E402"]
"testing/debug_scripts/dashboard_utils_smoke.py" = ["E402"]
"src/quant_core/market_adapters/ibkr/connection.py" = ["E402"]
"testing/debug_scripts/test_data_loading.py" = ["E402"]
"testing/debug_scripts/test_ui_logic.py" = ["E402"]
"testing/test_execution_safety.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
testpaths = ["testing"]
pythonpath = ["."]
# testing/debug_scripts holds ad-hoc scripts that happen to be named test_*.
# They need live network access and are not part of the suite. Phase 16 folds
# them in or deletes them.
addopts = "-q --strict-markers --ignore=testing/debug_scripts"
filterwarnings = [
    # backtesting.py warns when a position is still open on the final bar. The
    # suite opts into finalize_trades, so this is noise.
    "ignore:Some trades remain open:UserWarning",
]
